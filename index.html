<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd3e5">
  <title>K.L.K Memories | Memory Keepsake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Navigasi -->
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#/" aria-label="K.L.K Memories, ke beranda">
        <img src="logo.png" alt="Logo K.L.K">
        <div class="brand-name">K.L.K Memories <span>| Memory Keepsake</span></div>
      </a>
      <!-- Navigasi ini otomatis kosong untuk pengunjung biasa, hanya muncul jika owner login -->
      <nav id="nav"></nav>
    </div>
  </header>

  <!-- Konten Utama Aplikasi (Guest / Login / Admin) -->
  <main class="wrap" id="app"></main>

  <!-- Footer -->
  <footer>
    <div class="wrap">
      &copy; K.L.K Memories. All rights reserved.
    </div>
  </footer>

  <!-- Modal Popup Container -->
  <div id="modalContainer"></div>

  <!-- Toast Notifikasi Pop-up -->
  <div class="toast" id="toast" role="status"></div>

  <!-- Supabase CDN & Modul JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
